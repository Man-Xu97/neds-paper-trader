<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛马赛狗虚拟投注</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#101827;color:#f4f7fb;margin:0;padding:20px}main{max-width:720px;margin:auto}section{background:#1c293b;border-radius:14px;padding:18px;margin:14px 0}small,.muted{color:#b4c2d3}h1{font-size:24px}h2{font-size:19px}strong{font-size:28px}.warn{color:#ffd38b}li{margin:10px 0;line-height:1.5}button{background:#345a87;color:white;border:0;border-radius:9px;padding:10px 15px;font-size:15px}</style></head>
<body><main><h1>赛马赛狗 · 虚拟投注</h1><p class="warn">每注 A$1 · 仅模拟，不涉及真实资金</p>
<section><small>虚拟账户可用余额</small><p><strong id="cash">加载中…</strong></p><div id="stamp" class="muted"></div></section>
<section><h2>统计</h2><div id="stats">加载中…</div><p id="settlement"></p></section>
<section><h2>最近虚拟投注</h2><ul id="bets"><li>加载中…</li></ul></section>
<section><h2>最新赛事</h2><ul id="races"><li>加载中…</li></ul></section>
<section><h2>未结算原因</h2><ul id="diagnostics"><li>等待下一次扫描</li></ul></section><section><h2>运行信息</h2><div id="errors" class="muted">加载中…</div><p><button onclick="refresh()">立即刷新</button></p></section>
<small>每60秒自动刷新。数据来自公开状态文件，不展示密钥。</small></main>
<script>
const el=id=>document.getElementById(id);
const money=v=>'A$'+Number(v??0).toFixed(2);
const when=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Australia/Melbourne'}):'未知';
const category=v=>v==='horse'?'赛马':v==='greyhound'?'赛狗':(v||'未知');
function fillList(id,items,format,empty){const ul=el(id);ul.replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent=empty;ul.append(li);return;}for(const x of items){const li=document.createElement('li');li.textContent=format(x);ul.append(li);}}
async function refresh(){try{const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();
el('cash').textContent=money(d.bankroll_aud??1000);
el('stamp').textContent='最近扫描（墨尔本时间）：'+when(d.updated_at);
el('stats').textContent='累计扫描赛事：'+(d.races_seen_total??0)+' · 本轮新增赛事：'+(d.new_races??0)+' · Place 虚拟投注：'+(d.place_bets??0)+' · Favourite vs Field：'+(d.favourite_vs_field_bets??0);
el('settlement').textContent='已结算：'+(d.settled_bets??0)+' · 待结算：'+(d.paper_bets_open??0)+' · 胜：'+(d.wins??0)+' · 负：'+(d.losses??0)+' · 已实现盈亏：'+money(d.profit_aud);
fillList('bets',(d.recent_paper_bets||[]).slice().reverse().slice(0,30),b=>[category(b.category),b.runner_name||'未知选手',b.market||'PLACE','赔率 '+(b.odds??'?'),'投注 '+money(b.stake_aud),b.status==='OPEN'?'待结算':(b.status||'未知')].join(' · '),'暂无虚拟投注');
fillList('races',(d.observations||[]).slice(0,30),x=>[category(x.category),x.venue||'未知场地','R'+(x.race_number??'?'),when(x.start_time)].join(' · '),'暂无赛事记录');
fillList('diagnostics',(d.settlement_diagnostics||[]).slice(0,30),x=>(x.runner_name?x.runner_name+'：':'')+(x.reason||'未知原因'), '暂无待结算诊断');
el('errors').textContent='赛果返回：'+(d.results_returned??'未知')+' 场 · '+[...(d.errors||[]),...(d.settlement_error?[d.settlement_error]:[])].join('；')||d.notice||'无报告错误';
}catch(e){el('errors').textContent='读取失败：'+e.message;}}
refresh();setInterval(refresh,60000);
</script></body></html>
