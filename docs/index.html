<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Neds 虚拟投注研究</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#101827;color:#f4f7fb;margin:0;padding:24px}main{max-width:650px;margin:auto}section{background:#1c293b;border-radius:16px;padding:20px;margin:14px 0}small{color:#b4c2d3}h1{font-size:24px}strong{font-size:28px}.muted{color:#b4c2d3}.warn{color:#ffd38b}li{margin:9px 0}</style></head><body><main><h1>赛马赛狗 · 虚拟投注研究</h1><p class="warn">只读观察版 · 未启用虚拟下注 · 不涉及真实资金</p><section><small>研究本金（未下注）</small><p><strong>A$1,000</strong></p><div id="stamp" class="muted">等待扫描数据</div></section><section><h2>扫描概况</h2><div id="stats">加载中…</div></section><section><h2>最新赛事</h2><ul id="races"><li>暂无赛事记录</li></ul></section><section><h2>运行信息</h2><div id="errors" class="muted">尚未启动</div></section><small>每60秒刷新。公开页面不显示账户密钥。</small></main><script>async function refresh(){try{let r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();document.getElementById('stamp').textContent=d.updated_at?'最近扫描：'+new Date(d.updated_at).toLocaleString('zh-CN'):'尚未执行首次扫描';document.getElementById('stats').textContent='累计发现赛事：'+(d.races_seen_total??0)+' · 本轮新增：'+(d.new_races??0)+' · 正式虚拟投注：0';document.getElementById('errors').textContent=(d.errors||[]).join('；')||d.notice||'无报告错误';let ul=document.getElementById('races');ul.replaceChildren();(d.observations||[]).slice(0,30).forEach(x=>{let li=document.createElement('li');li.textContent=[x.category,x.venue,'R'+(x.race_number??'?'),x.start_time??''].join(' · ');ul.appendChild(li)});if(!ul.children.length){let li=document.createElement('li');li.textContent='暂无赛事记录';ul.appendChild(li)}}catch(e){document.getElementById('errors').textContent='读取失败：'+e.message}}refresh();setInterval(refresh,60000)</script></body></html>
